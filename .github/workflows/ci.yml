name: CI

on:
  push:
    branches:
      - master
      - main
  pull_request:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  build-test:
    name: Build and Test
    runs-on: windows-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: 还原依赖
        run: dotnet restore

      - name: 构建
        run: dotnet build --configuration Release --no-restore

      - name: 测试
        run: dotnet test --configuration Release --no-build --no-restore

      - name: 架构门禁检查
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $repoRoot = Get-Location
          $requiredAvaloniaVersion = "12.0.2"
          $requiredMvvmVersion = "8.4.2"
          $requiredAvaloniaVersionPattern = [regex]::Escape($requiredAvaloniaVersion)
          $requiredMvvmVersionPattern = [regex]::Escape($requiredMvvmVersion)
          $desktopPattern = 'Avalonia\.Desktop"\s+Version="' + $requiredAvaloniaVersionPattern + '"'
          $fluentPattern = 'Avalonia\.Themes\.Fluent"\s+Version="' + $requiredAvaloniaVersionPattern + '"'
          $mvvmPattern = 'CommunityToolkit\.Mvvm"\s+Version="' + $requiredMvvmVersionPattern + '"'
          $avaloniaProject = Join-Path $repoRoot "src/Zeye.RfidReader.Workbench.Avalonia/Zeye.RfidReader.Workbench.Avalonia.csproj"
          if (!(Test-Path $avaloniaProject)) {
            throw "未找到 Avalonia 项目文件。"
          }

          $avaloniaContent = Get-Content $avaloniaProject -Raw
          if ($avaloniaContent -notmatch $desktopPattern) {
            throw "Avalonia.Desktop 必须固定为 $requiredAvaloniaVersion。"
          }

          if ($avaloniaContent -notmatch $fluentPattern) {
            throw "Avalonia.Themes.Fluent 必须固定为 $requiredAvaloniaVersion。"
          }

          if ($avaloniaContent -notmatch $mvvmPattern) {
            throw "CommunityToolkit.Mvvm 必须固定为 $requiredMvvmVersion。"
          }

          if ($avaloniaContent -match 'Avalonia\.[^"]*"\s+Version="11\.') {
            throw "禁止降级 Avalonia 到 11.x。"
          }

          if ($avaloniaContent -match 'PackageReference\s+Include="ReactiveUI"') {
            throw "禁止引入 ReactiveUI。"
          }

          if ($avaloniaContent -match 'PackageReference\s+Include="Avalonia\.ReactiveUI"') {
            throw "禁止引入 Avalonia.ReactiveUI。"
          }

          if ($avaloniaContent -match 'PackageReference\s+Include="Prism\.Wpf"') {
            throw "禁止引入 Prism.Wpf。"
          }

          if ($avaloniaContent -match 'PackageReference\s+Include="MediatR"') {
            throw "禁止引入 MediatR。"
          }

          if ($avaloniaContent -match 'PackageReference\s+Include="Splat"') {
            throw "禁止引入 Splat。"
          }

          $requiredUiFiles = @(
            "src/Zeye.RfidReader.Workbench.Avalonia/Services/IAppNavigationService.cs",
            "src/Zeye.RfidReader.Workbench.Avalonia/Services/AppNavigationService.cs",
            "src/Zeye.RfidReader.Workbench.Avalonia/Services/IDialogService.cs",
            "src/Zeye.RfidReader.Workbench.Avalonia/Services/DialogService.cs",
            "src/Zeye.RfidReader.Workbench.Avalonia/Services/IToastNotificationService.cs",
            "src/Zeye.RfidReader.Workbench.Avalonia/Services/ToastNotificationService.cs",
            "src/Zeye.RfidReader.Workbench.Avalonia/Services/IUiDispatcher.cs",
            "src/Zeye.RfidReader.Workbench.Avalonia/Services/AvaloniaUiDispatcher.cs",
            "src/Zeye.RfidReader.Workbench.Avalonia/ViewModels/DashboardViewModel.cs",
            "src/Zeye.RfidReader.Workbench.Avalonia/Views/DashboardView.axaml"
          )

          foreach ($requiredFile in $requiredUiFiles) {
            $path = Join-Path $repoRoot $requiredFile
            if (!(Test-Path $path)) {
              throw "缺少 UI 基线文件：$requiredFile"
            }
          }

          $sourceFiles = Get-ChildItem -Path (Join-Path $repoRoot "src") -Recurse -Include *.cs |
            Where-Object { $_.FullName -notmatch '\\(obj|bin)\\' }

          foreach ($file in $sourceFiles) {
            $content = Get-Content $file.FullName -Raw

            if ($content -match 'new\s+MainWindowViewModel\s*\(') {
              throw "禁止手动 new MainWindowViewModel：$($file.FullName)"
            }

            if ($content -match 'new\s+MainWindow\s*\(') {
              throw "禁止手动 new MainWindow：$($file.FullName)"
            }
          }

          $programFile = Join-Path $repoRoot "src/Zeye.RfidReader.Workbench.Avalonia/Program.cs"
          if (Test-Path $programFile) {
            $programContent = Get-Content $programFile -Raw
            if ($programContent -match 'static\s+ServiceProvider\s+Services') {
              throw "Program.cs 禁止暴露全局静态 ServiceProvider。"
            }

            if ($programContent -match 'ServiceProvider') {
              throw "Program.cs 禁止出现 ServiceProvider。"
            }
          }

          $appFile = Join-Path $repoRoot "src/Zeye.RfidReader.Workbench.Avalonia/App.axaml.cs"
          if (Test-Path $appFile) {
            $appContent = Get-Content $appFile -Raw
            if ($appContent -match 'BuildServiceProvider') {
              throw "App.axaml.cs 禁止出现 BuildServiceProvider，请使用 AvaloniaServiceProviderFactory。"
            }

            if ($appContent -match 'new\s+ServiceCollection') {
              throw "App.axaml.cs 禁止直接创建 ServiceCollection，请使用 AvaloniaServiceProviderFactory。"
            }
          }

          $mainWindowCodeBehind = Join-Path $repoRoot "src/Zeye.RfidReader.Workbench.Avalonia/Views/MainWindow.axaml.cs"
          if (Test-Path $mainWindowCodeBehind) {
            $mainWindowCodeBehindContent = Get-Content $mainWindowCodeBehind -Raw
            if ($mainWindowCodeBehindContent -match 'public\s+MainWindow\s*\(\s*\)') {
              throw "MainWindow.axaml.cs 禁止保留无参构造函数。"
            }
          }

          $mainWindowViewModel = Join-Path $repoRoot "src/Zeye.RfidReader.Workbench.Avalonia/ViewModels/MainWindowViewModel.cs"
          if (Test-Path $mainWindowViewModel) {
            $viewModelContent = Get-Content $mainWindowViewModel -Raw
            if ($viewModelContent -match 'record\s+class\s+MainWindowViewModel') {
              throw "MainWindowViewModel 禁止继续使用 record class，必须使用真正 MVVM 基类。"
            }

            if ($viewModelContent -notmatch ':\s+ViewModelBase') {
              throw "MainWindowViewModel 必须继承 ViewModelBase。"
            }

            if ($viewModelContent -match 'using\s+Zeye\.RfidReader\.Workbench\.Infrastructure') {
              throw "MainWindowViewModel 禁止引用 Infrastructure 命名空间。"
            }
          }

          $avaloniaViewModels = Get-ChildItem -Path (Join-Path $repoRoot "src/Zeye.RfidReader.Workbench.Avalonia/ViewModels") -Recurse -Include *.cs |
            Where-Object { $_.FullName -notmatch '\\(obj|bin)\\' }

          foreach ($viewModelFile in $avaloniaViewModels) {
            $viewModelFileContent = Get-Content $viewModelFile.FullName -Raw
            if ($viewModelFileContent -match 'new\s+SimulatedRfidReaderSession\s*\(') {
              throw "Avalonia ViewModel 禁止直接创建 SimulatedRfidReaderSession：$($viewModelFile.FullName)"
            }
          }

          $mainWindowXaml = Join-Path $repoRoot "src/Zeye.RfidReader.Workbench.Avalonia/Views/MainWindow.axaml"
          if (Test-Path $mainWindowXaml) {
            $mainWindowXamlContent = Get-Content $mainWindowXaml -Raw
            if ($mainWindowXamlContent -match 'lottie:Lottie') {
              throw "MainWindow.axaml 禁止直接使用 lottie:Lottie，必须封装到 RfidLottieView。"
            }
          }

          $viewModelBase = Join-Path $repoRoot "src/Zeye.RfidReader.Workbench.Avalonia/ViewModels/ViewModelBase.cs"
          if (!(Test-Path $viewModelBase)) {
            throw "缺少 ViewModelBase.cs。"
          }

          $serviceProviderFactory = Join-Path $repoRoot "src/Zeye.RfidReader.Workbench.Avalonia/Bootstrap/AvaloniaServiceProviderFactory.cs"
          if (!(Test-Path $serviceProviderFactory)) {
            throw "缺少 AvaloniaServiceProviderFactory.cs。"
          }

          $lottieView = Join-Path $repoRoot "src/Zeye.RfidReader.Workbench.Avalonia/Controls/RfidLottieView.axaml"
          if (!(Test-Path $lottieView)) {
            throw "缺少 RfidLottieView.axaml。"
          }

          $avaloniaDiFile = Join-Path $repoRoot "src/Zeye.RfidReader.Workbench.Avalonia/DependencyInjection/ServiceCollectionExtensions.cs"
          if (Test-Path $avaloniaDiFile) {
            $avaloniaDiContent = Get-Content $avaloniaDiFile -Raw
            if ($avaloniaDiContent -match 'AddSingleton<MainWindowViewModel>' -or $avaloniaDiContent -match 'AddSingleton<MainWindow>') {
              throw "Avalonia 视图模型和窗口禁止使用 Singleton 注册。"
            }

            if ($avaloniaDiContent -notmatch 'AddTransient<MainWindowViewModel>' -or $avaloniaDiContent -notmatch 'AddTransient<MainWindow>') {
              throw "Avalonia 视图模型和窗口必须使用 AddTransient 注册。"
            }
          }

          $avaloniaTests = Join-Path $repoRoot "tests/Zeye.RfidReader.Workbench.Avalonia.Tests"
          if (!(Test-Path $avaloniaTests)) {
            throw "缺少 Avalonia.Tests 测试项目。"
          }

          if (!(Test-Path (Join-Path $repoRoot "README.md"))) {
            throw "README.md 不存在。"
          }

          if (!(Test-Path (Join-Path $repoRoot ".github/copilot-instructions.md"))) {
            throw ".github/copilot-instructions.md 不存在。"
          }

          $markdownFiles = Get-ChildItem -Path $repoRoot -Recurse -Include *.md |
            Where-Object { $_.FullName -notmatch '\\(bin|obj|\.git)\\' }

          foreach ($md in $markdownFiles) {
            if ($md.Name -eq "README.md" -or $md.FullName -eq (Join-Path $repoRoot ".github/copilot-instructions.md")) {
              continue
            }

            if ($md.Name -notmatch '\p{IsCJKUnifiedIdeographs}') {
              throw "除 README.md 与 .github/copilot-instructions.md 外，md 文件名必须包含中文：$($md.FullName)"
            }
          }

          $nlogFiles = Get-ChildItem -Path $repoRoot -Recurse -Filter nlog.config |
            Where-Object { $_.FullName -notmatch '\\(bin|obj)\\' }

          if ($nlogFiles.Count -eq 0) {
            Write-Host "提示：当前仓库尚未接入 nlog.config，暂不执行 archiveAboveSize 阻断检查。"
          }

          foreach ($nlog in $nlogFiles) {
            $nlogContent = Get-Content $nlog.FullName -Raw
            if ($nlogContent -notmatch 'archiveAboveSize="10485760"') {
              throw ('NLog 文件目标必须配置 archiveAboveSize="10485760"：{0}' -f $nlog.FullName)
            }
          }
